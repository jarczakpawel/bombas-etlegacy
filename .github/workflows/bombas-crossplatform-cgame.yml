name: Bombas cross-platform native cgame

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main, feature/bombas-r87-m1897, feature/bombas-r88-knife-hud, feature/bombas-r89-team-loadout-ff-fixes, feature/bombas-r94-ppsh-stg44-bar, feature/bombas-r98-missile-camera, feature/bombas-r104-team-ping, feature/bombas-r105-three-fixes, feature/bombas-r106-knife-hud-corrections]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux64
            flags: -64
          - id: linux32
            flags: ""
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install native Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential gcc-multilib g++-multilib pkg-config
      - name: Build native module
        shell: bash
        run: |
          if [ "${{ matrix.id }}" = 'linux32' ]; then mode=ON; else mode=OFF; fi
          cmake -S . -B build -DCROSS_COMPILE32=$mode -DBUILD_MOD=ON -DBUILD_CLIENT_MOD=ON -DBUILD_SERVER_MOD=OFF -DBUILD_CLIENT=OFF -DBUILD_SERVER=OFF -DBUILD_MOD_PK3=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target cgame -j 4
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: build/legacy/cgame*.so
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows64
            flags: -64
          - id: windows32
            flags: ""
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build native module
        shell: cmd
        run: call .\easybuild.bat build -mod ${{ matrix.flags }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: build/legacy/cgame*.dll
          if-no-files-found: error
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: brew bundle
      - name: Build Intel and ARM module
        env:
          SDKROOT: /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
          DEVELOPER_DIR: /Library/Developer/CommandLineTools
        run: ./easybuild.sh build -64 -mod --osx=10.10 --osx-arc="x86_64;arm64" -j
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/legacy/cgame_mac
          if-no-files-found: error
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs: [linux, windows, macos]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: binaries
          merge-multiple: false
      - name: Create verified auto-download PK3
        run: python3 tools/bombas/package_crossplatform.py --artifacts binaries --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: bombas-universal-client-pk3
          path: dist/*.pk3
          if-no-files-found: error
      - name: Publish SHA-verified client to dedicated release branch
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const owner = context.repo.owner, repo = context.repo.repo;
            const versionFile = 'tools/bombas/CLIENT_VERSION';
            const version = fs.existsSync(versionFile) ? Number(fs.readFileSync(versionFile, 'utf8').trim()) : 84;
            if (!Number.isInteger(version) || version < 1 || version > 999) throw new Error('Invalid client version');
            const filename = new RegExp('^zzzzzz_bombas_client_universal_v' + String(version).padStart(3,'0') + '_[a-f0-9]{12}\\.pk3$');
            const files = fs.readdirSync('dist').filter(n => filename.test(n));
            if (files.length !== 1) throw new Error('Expected exactly one validated universal client package');
            const bytes = fs.readFileSync('dist/' + files[0]);
            const digest = crypto.createHash('sha256').update(bytes).digest('hex');
            if (!files[0].endsWith(digest.slice(0, 12) + '.pk3')) throw new Error('Package filename hash mismatch');
            const blob = await github.rest.git.createBlob({owner, repo, encoding:'base64', content:bytes.toString('base64')});
            const meta = Buffer.from(JSON.stringify({file:files[0],sha256:digest,source_commit:context.sha,platform:'linux-windows-macos'},null,2)+'\n');
            const info = await github.rest.git.createBlob({owner,repo,encoding:'base64',content:meta.toString('base64')});
            const tree = await github.rest.git.createTree({owner,repo,tree:[
              {path:'client.pk3',mode:'100644',type:'blob',sha:blob.data.sha},
              {path:'release.json',mode:'100644',type:'blob',sha:info.data.sha}
            ]});
            let old = null;
            try {const r=await github.rest.git.getRef({owner,repo,ref:'heads/bombas-client-release'});old=r.data.object.sha;}
            catch(e){if(e.status!==404)throw e;}
            const commit = await github.rest.git.createCommit({owner,repo,message:'Verified universal Bombas client '+context.sha.slice(0,12),tree:tree.data.sha,parents:old?[old]:[]});
            if (old) await github.rest.git.updateRef({owner,repo,ref:'heads/bombas-client-release',sha:commit.data.sha,force:true});
            else await github.rest.git.createRef({owner,repo,ref:'refs/heads/bombas-client-release',sha:commit.data.sha});
            core.info('Published '+files[0]+' sha256 '+digest+' to bombas-client-release');
